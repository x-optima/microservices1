# API Gateway на NGINX: единая точка входа для security, uploader и storage.
# Проверяет JWT до передачи запроса (auth_request) и маршрутизирует по location.
# Схема маршрутов — в README.md.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Группы серверов-получателей (upstream). Имена совпадают с сервисами
    # в docker-compose, Docker-DNS находит их в сети проекта. Для балансировки
    # достаточно добавить строку server — запросы чередуются по кругу (round-robin).
    upstream security {
        server security:3000;
    }

    upstream uploader {
        server uploader:3000;
    }

    upstream storage {
        server storage:9000;
    }

    server {
        listen 8080;

        # Лимит тела запроса: слишком большие файлы отклоняются на шлюзе.
        client_max_body_size 20m;

        # Внутренний эндпоинт проверки токена для auth_request.
        # internal запрещает вызов /_auth напрямую от клиента.
        location = /_auth {
            internal;
            # Слэш в конце не ставим: роут Flask без слэша на URL со слэшем
            # отвечает 404, что ломает auth_request (см. README).
            proxy_pass http://security/v1/token/validation;
            # Тело исходного запроса этому подзапросу не нужно: экономим трафик.
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            # Заголовок Authorization клиента передаём как есть —
            # проверкой токена занимается security.
            proxy_set_header Authorization $http_authorization;
        }

        # --- Публичные маршруты (анонимный доступ) ---

        # Регистрация: наружу /v1/register, внутри сервиса — POST /v1/user.
        location = /v1/register {
            proxy_pass http://security/v1/user;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
        }

        # Логин: анонимный по определению, проверять токен нечего.
        location = /v1/token {
            proxy_pass http://security/v1/token;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
        }

        # --- Защищённые маршруты: сначала проверка /_auth, затем передача запроса ---

        # Данные о текущем пользователе. Токен передаём дальше:
        # security сам берёт логин из данных JWT.
        location = /v1/user {
            auth_request /_auth;
            proxy_pass http://security/v1/user;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Раздача картинок: GET /v1/user/{image} -> GET MinIO /images/{image}.
        # Regex-location с именованной группой: путь в proxy_pass
        # передаётся через переменную.
        location ~ ^/v1/user/(?<image>.+)$ {
            auth_request /_auth;
            proxy_pass http://storage/images/$image;
        }

        # Загрузка файла в uploader.
        # HTTP/1.1 + отключение буферизации: тело уходит в uploader потоком,
        # не дожидаясь приёма всего файла шлюзом.
        location = /v1/upload {
            auth_request /_auth;
            proxy_pass http://uploader/v1/upload;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_request_buffering off;
        }

        # --- Дополнительные маршруты для curl-команд из раздела «Ожидаемый результат» ---

        location = /token {
            proxy_pass http://security/v1/token;
            proxy_set_header Host $host;
            proxy_set_header Content-Type $http_content_type;
        }

        location = /upload {
            auth_request /_auth;
            proxy_pass http://uploader/v1/upload;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_request_buffering off;
        }

        # Публичная раздача: бакет images разрешает скачивание без подписи,
        # поэтому curl работает без заголовка Authorization.
        location /images/ {
            proxy_pass http://storage/images/;
        }
    }
}
